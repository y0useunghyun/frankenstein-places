<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프랑켄슈타인 장소 사진</title>
<style>
  :root { --bg: #e9e7e3; --ink: #1d1c1a; --sub: #6d6a64; --line: #1d1c1a; --card: #fbfaf8; --pageW: 520px; --gut: 220px; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.5 "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif; }
  header { max-width: 980px; margin: 0 auto; padding: 48px 16px 24px; }
  h1 { font: 500 22px/1.3 inherit; margin: 0 0 6px; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--sub); }
  .tools { margin-top: 18px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .tools label { cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .index { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--sub); }
  .index a { color: inherit; text-decoration: none; }
  .index a:hover { color: var(--ink); text-decoration: underline; }
  .index b { font-weight: 500; color: var(--ink); }

  main { padding: 0 16px 120px; }
  .spread { display: grid; grid-template-columns: var(--gut) var(--pageW) var(--gut); justify-content: center; gap: 0 28px; margin: 0 auto 36px; }
  .page { position: relative; grid-column: 2; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06); background: #fff; }
  .page img { display: block; width: 100%; height: auto; }
  .gut { position: relative; }
  .gut.l { grid-column: 1; grid-row: 1; }
  .gut.r { grid-column: 3; grid-row: 1; }
  body.only .spread:not(.has) { display: none; }

  .mark { position: absolute; border-bottom: 1.5px solid var(--line); }
  .lead i { position: absolute; top: -7px; font: 600 9px/1 inherit; font-style: normal; background: var(--ink); color: #fff; padding: 2px 3px; border-radius: 2px; }
  .lead.r i { right: -6px; } .lead.l i { left: -6px; }
  .num { font-weight: 600; }
  .lead { position: absolute; height: 0; border-top: 1px solid var(--line); opacity: .55; }

  .card { position: absolute; left: 0; right: 0; background: var(--card); padding: 7px 7px 9px; box-shadow: 0 1px 2px rgba(0,0,0,.1), 0 6px 16px rgba(0,0,0,.08); }
  .card img { display: block; width: 100%; height: auto; filter: contrast(1.04); }
  .card .t { margin-top: 7px; font-weight: 500; }
  .card .t i { font-style: normal; font-weight: 600; margin-right: 4px; }
  .card .s { color: var(--sub); font-size: 11px; line-height: 1.4; }
  .card a { color: inherit; }

  @media (max-width: 1100px) {
    :root { --gut: 0px; }
    .spread { grid-template-columns: minmax(0, var(--pageW)); gap: 14px; }
    .page { grid-column: 1; }
    .gut { display: none; }
    .lead { border-top-color: transparent; }
    .below { grid-column: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .below .card { position: static; }
  }
  @media (min-width: 1101px) { .below { display: none; } }
</style>
</head>
<body>
<header>
  <h1>프랑켄슈타인 — 장소 사진 시안</h1>
  <p>메리 셸리 『프랑켄슈타인』(문학동네, 김선형 옮김) 지면 위에 원문 속 장소의 옛 사진을 붙였다. 사진은 위키미디어 공용에서 고른 흑백 이미지. 사진술(1839) 이전 시대라 판화·초기 사진으로 대신했다.</p>
  <div class="tools">
    <label><input type="checkbox" id="only"> 사진 있는 쪽만</label>
    <span id="count"></span>
  </div>
  <nav class="index" id="index"></nav>
</header>
<main id="book"></main>
<script>
const PAGES = 280, CARD_GAP = 10;
const book = document.getElementById('book');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

function card(p, n) {
  const meta = [p.year, p.artist, p.license].filter(Boolean).map(esc).join(' · ');
  return `<div class="card" data-n="${n}">
    <a href="${esc(p.url)}" target="_blank" rel="noopener"><img src="photos/${esc(p.key)}.jpg" width="${p.w}" height="${p.h}" loading="lazy" alt="${esc(p.term)} — ${esc(p.en)}"></a>
    <div class="t"><i>${n}</i>${esc(p.label)} · ${esc(p.en)}</div>
    <div class="s">${meta}</div></div>`;
}

// 카드가 서로 겹치지 않게 아래로 밀기
function stack(gut) {
  let floor = 0;
  [...gut.querySelectorAll('.card')].forEach(c => {
    const want = parseFloat(c.dataset.want) * gut.offsetHeight - 14;
    const top = Math.max(want, floor);
    c.style.top = top + 'px';
    floor = top + c.offsetHeight + CARD_GAP;
  });
}

fetch('places.json').then(r => r.json()).then(places => {
  const byPage = {};
  places.forEach((p, i) => (byPage[p.page] ??= []).push({ ...p, n: i + 1 }));
  document.getElementById('count').textContent = `장소 ${places.length}곳 · ${Object.keys(byPage).length}쪽`;
  document.getElementById('index').innerHTML = places.map((p, i) =>
    `<a href="#p${p.page}"><b>${i + 1}</b> ${esc(p.en)}</a>`).join('');

  let html = '';
  for (let pg = 1; pg <= PAGES; pg++) {
    const ps = byPage[pg] || [];
    const side = pg % 2 ? 'r' : 'l';           // 홀수 쪽 → 오른쪽 바깥, 짝수 쪽 → 왼쪽 바깥
    const marks = ps.filter(p => p.box).map(p => {
      const [x0, y0, x1, y1] = p.box;
      const lead = side === 'r'
        ? `<div class="lead r" style="left:${x1 * 100}%;right:0;top:${y1 * 100}%"><i>${p.n}</i></div>`
        : `<div class="lead l" style="left:0;right:${(1 - x0) * 100}%;top:${y1 * 100}%"><i>${p.n}</i></div>`;
      return `<div class="mark" style="left:${x0 * 100}%;top:${y0 * 100}%;width:${(x1 - x0) * 100}%;height:${(y1 - y0) * 100}%"></div>${lead}`;
    }).join('');
    const cards = ps.map(p => card(p, p.n).replace('class="card"', `class="card" data-want="${p.box ? p.box[3] : 0.1}"`)).join('');
    html += `<section class="spread${ps.length ? ' has' : ''}" id="p${pg}">
      <div class="page"><img src="pages/${String(pg).padStart(3, '0')}.jpg" width="847" height="1205" loading="lazy" alt="${pg}쪽">${marks}</div>
      ${ps.length ? `<div class="gut ${side}">${cards}</div><div class="below">${ps.map(p => card(p, p.n)).join('')}</div>` : ''}
    </section>`;
  }
  book.innerHTML = html;

  const relayout = () => document.querySelectorAll('.gut').forEach(stack);
  window.addEventListener('resize', relayout);
  document.querySelectorAll('.gut img').forEach(img => img.addEventListener('load', () => stack(img.closest('.gut'))));
  relayout();
  if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
});

const only = document.getElementById('only');
try { only.checked = localStorage.getItem('fk-only') === '1'; } catch {}
document.body.classList.toggle('only', only.checked);
only.addEventListener('change', () => {
  document.body.classList.toggle('only', only.checked);
  try { localStorage.setItem('fk-only', only.checked ? '1' : '0'); } catch {}
});
</script>
</body>
</html>
