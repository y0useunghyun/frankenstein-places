<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프랑켄슈타인 원문</title>
<style>
  body { margin: 0; background: #fff; color: #111; font: 16px/1.85 "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 64px 16px 160px; }
  h2 { font-size: 18px; font-weight: 600; margin: 4em 0 1.2em; }
  p { margin: 0 0 .9em; word-break: keep-all; }
  p.note { font-size: 12.5px; line-height: 1.6; color: #777; margin: -.2em 0 1.2em; }
  /* 쪽 번호: 글줄에 끼지 않게 폭 0, 왼쪽 여백에 표시 */
  p, h2 { position: relative; }
  .pg { display: inline-block; width: 0; font-size: 0; }
  .pg::before { content: attr(id); content: attr(data-n); position: absolute; left: -44px; font-size: 10px; color: #b0b0b0; font-weight: 400; font-variant-numeric: tabular-nums; }
  @media (max-width: 760px) { main { padding-left: 40px; } .pg::before { left: -30px; } }
</style>
</head>
<body><main>
{{BODY}}
</main></body>
</html>
