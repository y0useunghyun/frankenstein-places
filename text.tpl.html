<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프랑켄슈타인 원문</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; color: #111; }
  /* 같은 글자 화면 두 장을 좌우로 붙여서, 한 장만큼 가면 이음새 없이 처음으로 */
  #wall { position: fixed; top: 0; left: 0; display: flex; width: 200vw; will-change: transform; }
  .sheet { width: 100vw; box-sizing: border-box; padding: 10px; font: 13px/1.55 "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; word-break: break-all; text-align: justify; }
</style>
</head>
<body>
<div id="wall"><div class="sheet">{{BODY}}</div><div class="sheet" aria-hidden="true">{{BODY}}</div></div>
<script>
// 저절로 대각선으로 흐름 (오른쪽 + 아래). 클릭·스페이스 = 멈춤/다시
const VX = 30, VY = 22;      // 초당 px
const wall = document.getElementById('wall'), sheet = wall.firstElementChild;
let on = true, last = 0, x = 0, y = 0;
function step(t) {
  if (on && last) {
    const dt = Math.min(t - last, 100) / 1000;
    x = (x + VX * dt) % sheet.offsetWidth;
    y += VY * dt;
    if (y > sheet.offsetHeight - innerHeight) y = 0;
    wall.style.transform = `translate(${-x}px, ${-y}px)`;
  }
  last = t; requestAnimationFrame(step);
}
requestAnimationFrame(step);
const toggle = () => { on = !on; };
addEventListener('click', toggle);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); toggle(); } });
</script>
</body>
</html>
