<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프랑켄슈타인 원문</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; color: #111; }
  body { cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
  body.drag { cursor: grabbing; }
  #book { position: fixed; top: 0; left: 0; transform-origin: 0 0; will-change: transform;
          font: 13px/1.55 "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; word-break: break-all; text-align: justify; }
  .h { position: relative; }
  .h::after { content: attr(data-t); position: absolute; left: 0; top: 50%; transform: translateY(-50%);
              white-space: nowrap; pointer-events: none; font-weight: 700; line-height: 1; letter-spacing: -0.03em; }
  .h1::after { font-size: 72px; } .h2::after { font-size: 150px; } .h3::after { font-size: 260px; top: 0; transform: none; }
</style>
</head>
<body>
<div id="book">{{BODY}}</div>
<script>
// 책 한 권 = 화면 비율의 직사각형 한 덩어리. 반복 없음.
// 저절로 흐르다 가장자리에서 튕김. 휠·+/− = 축소·확대(최소 = 한 권 전체), 끌기 = 직접, 클릭·스페이스 = 멈춤
const book = document.getElementById('book');
let W, H, MIN, s = 1, x = 0, y = 0, vx = 30, vy = 22, on = true, last = 0, grab = null;

function layout() {                    // 덩어리 비율을 화면 비율에 맞춤 (두 번 재면 거의 맞음)
  const aspect = innerWidth / innerHeight;
  book.style.width = innerWidth + 'px';
  for (let i = 0; i < 2; i++) {
    const area = book.offsetWidth * book.offsetHeight;
    book.style.width = Math.round(Math.sqrt(area * aspect)) + 'px';
  }
  W = book.offsetWidth; H = book.offsetHeight;
  MIN = Math.min(innerWidth / W, innerHeight / H);
}
function clamp() {                     // 화면보다 작으면 가운데, 크면 덩어리 안에서만
  const vw = innerWidth / s, vh = innerHeight / s;
  x = W > vw ? Math.min(Math.max(0, x), W - vw) : (W - vw) / 2;
  y = H > vh ? Math.min(Math.max(0, y), H - vh) : (H - vh) / 2;
}
function draw() { clamp(); book.style.transform = `scale(${s}) translate(${-x}px, ${-y}px)`; }
function zoom(f) {                     // 화면 가운데 기준
  const s1 = Math.min(3, Math.max(MIN, s * f));
  x += innerWidth / 2 / s - innerWidth / 2 / s1;
  y += innerHeight / 2 / s - innerHeight / 2 / s1;
  s = s1; draw();
}
function step(t) {
  if (on && !grab && last) {
    const dt = Math.min(t - last, 100) / 1000;
    x += vx * dt; y += vy * dt;
    const vw = innerWidth / s, vh = innerHeight / s;
    if (x <= 0 || x >= W - vw) vx = x <= 0 ? Math.abs(vx) : -Math.abs(vx);   // 가장자리에서 튕김
    if (y <= 0 || y >= H - vh) vy = y <= 0 ? Math.abs(vy) : -Math.abs(vy);
    draw();
  }
  last = t; requestAnimationFrame(step);
}
layout(); draw(); requestAnimationFrame(step);

addEventListener('wheel', e => { e.preventDefault(); zoom(Math.exp(-e.deltaY * 0.002)); }, { passive: false });
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); on = !on; }
  else if (e.key === '+' || e.key === '=') zoom(1.25);
  else if (e.key === '-' || e.key === '_') zoom(0.8);
  else if (e.key === '0') { s = 1; draw(); }
});
addEventListener('pointerdown', e => { grab = { px: e.clientX, py: e.clientY, x, y, moved: false }; document.body.classList.add('drag'); });
addEventListener('pointermove', e => {
  if (!grab) return;
  const dx = e.clientX - grab.px, dy = e.clientY - grab.py;
  if (Math.abs(dx) + Math.abs(dy) > 4) grab.moved = true;
  x = grab.x - dx / s; y = grab.y - dy / s; draw();
});
addEventListener('pointerup', () => { if (grab && !grab.moved) on = !on; grab = null; document.body.classList.remove('drag'); });
addEventListener('pointercancel', () => { grab = null; document.body.classList.remove('drag'); });
addEventListener('resize', () => { layout(); s = Math.max(s, MIN); draw(); });
</script>
</body>
</html>
